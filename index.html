<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>ProteusBoard Arts et Métiers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: Proteus Group identity — black ground, white grotesque caps, one electric-blue block (logo + active state). Sidebar nav, content column. Dark-first. */
:root{
  --bg:#000; --surface:#0b0b0d; --surface-2:#141418; --line:#26262c; --line-2:#3a3a42;
  --fg:#fff; --muted:#8d8d98; --blue:#1a2bff; --blue-fg:#fff; --blue-soft:rgba(26,43,255,.18);
  --in:#2fd27a; --in-soft:rgba(47,210,122,.12); --out:#ff4d3d; --out-soft:rgba(255,77,61,.12);
  --warn:#f5b83d; --warn-soft:rgba(245,184,61,.14);
  --font:"Inter Tight","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:2px; color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#fff; --surface:#f6f6f8; --surface-2:#ececf0; --line:#e0e0e6; --line-2:#c9c9d2;
  --fg:#000; --muted:#5f5f6b; --blue:#1426f0; --blue-fg:#fff; --blue-soft:rgba(20,38,240,.10);
  --in:#0e8f4a; --in-soft:rgba(14,143,74,.10); --out:#d6261a; --out-soft:rgba(214,38,26,.09);
  --warn:#9a6400; --warn-soft:rgba(200,140,0,.13); color-scheme:light;}}
:root[data-theme="light"]{
  --bg:#fff; --surface:#f6f6f8; --surface-2:#ececf0; --line:#e0e0e6; --line-2:#c9c9d2;
  --fg:#000; --muted:#5f5f6b; --blue:#1426f0; --blue-fg:#fff; --blue-soft:rgba(20,38,240,.10);
  --in:#0e8f4a; --in-soft:rgba(14,143,74,.10); --out:#d6261a; --out-soft:rgba(214,38,26,.09);
  --warn:#9a6400; --warn-soft:rgba(200,140,0,.13); color-scheme:light;}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
/* sidebar */
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--bg);padding-left:env(safe-area-inset-left,0px)}
.logo{background:var(--blue);color:var(--blue-fg);padding:18px 18px 16px;display:flex;flex-direction:column;gap:22px}
.logo small{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;line-height:1.25;opacity:.92}
.logo b{font-weight:500;font-size:22px;letter-spacing:-.02em;line-height:1}
.logo span{font-size:11px;text-transform:uppercase;letter-spacing:.04em}
nav.menu{display:flex;flex-direction:column;padding:14px 10px;gap:2px;overflow:auto;flex:1}
nav.menu a{display:flex;align-items:center;justify-content:space-between;gap:8px;text-decoration:none;padding:9px 10px;border-radius:var(--r);text-transform:uppercase;font-size:12.5px;letter-spacing:.03em;color:var(--muted)}
nav.menu a:hover{color:var(--fg);background:var(--surface)}
nav.menu a[aria-current="page"]{color:var(--fg);background:var(--surface-2)}
nav.menu a[aria-current="page"]::before{content:"";width:6px;height:6px;background:var(--blue);margin-right:-2px}
nav.menu a .lv{font-family:var(--mono);font-size:9.5px;letter-spacing:0;color:var(--muted);border:1px solid var(--line-2);padding:1px 5px;border-radius:var(--r);margin-left:auto}
nav.menu a.locked{opacity:.35;pointer-events:none}
.who{border-top:1px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:8px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.who strong{color:var(--fg);font-weight:500}
.who select{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:6px 8px;text-transform:none;letter-spacing:0;font-size:12px}
/* main */
main{min-width:0;padding-block:28px 64px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.head h1{margin:0;font-weight:500;font-size:clamp(28px,4vw,44px);letter-spacing:-.025em;line-height:1;text-transform:uppercase;text-wrap:balance}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:10px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.conf{font-family:var(--mono);font-size:10.5px;letter-spacing:0;text-transform:none;border:1px solid var(--line-2);padding:2px 7px;border-radius:var(--r)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;cursor:pointer;border:1px solid var(--line-2);background:transparent;padding:8px 13px;border-radius:var(--r);font-size:12px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.btn:hover{border-color:var(--fg)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--blue-fg)}
.btn.primary:hover{filter:brightness(1.12)}
.btn.ghost{border-color:transparent;color:var(--muted);padding:5px 7px}
.btn.ghost:hover{color:var(--fg);border-color:var(--line-2)}
.btn.danger{color:var(--out);border-color:var(--out)}
.btn.sm{padding:5px 9px;font-size:11px}
section.block{margin-top:28px}
section.block > h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:500;color:var(--muted);margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.panel{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);min-width:0}
.pad{padding:18px}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.kpi{background:var(--bg);padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kpi .v{font-size:clamp(28px,3.4vw,40px);font-weight:500;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.kpi.accent{background:var(--blue);color:var(--blue-fg)}
.kpi.accent .l,.kpi.accent .s{color:var(--blue-fg);opacity:.85}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px}
/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.mono{font-family:var(--mono);font-size:12px;white-space:nowrap;color:var(--muted)}
tr.in td.amt{color:var(--in)} tr.out td.amt{color:var(--out)}
tr.in td:first-child{box-shadow:inset 3px 0 0 var(--in)} tr.out td:first-child{box-shadow:inset 3px 0 0 var(--out)}
tr.future td{opacity:.78} tr.future td.amt{font-style:italic}
td .rowact{display:flex;gap:2px;justify-content:flex-end}
.empty{padding:36px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-weight:500;margin-bottom:4px;text-transform:uppercase;font-size:12px;letter-spacing:.05em}
/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;padding:3px 7px;border-radius:var(--r);white-space:nowrap;border:1px solid transparent}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-in{color:var(--in);background:var(--in-soft)} .p-out{color:var(--out);background:var(--out-soft)}
.p-warn{color:var(--warn);background:var(--warn-soft)} .p-blue{color:var(--fg);background:var(--blue-soft);border-color:var(--blue)}
.p-mute{color:var(--muted);border-color:var(--line-2)} .p-mute::before{display:none}
.tag{font-family:var(--mono);font-size:10px;color:var(--muted);border:1px dashed var(--line-2);padding:1px 5px;border-radius:var(--r);margin-left:6px;white-space:nowrap}
/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 11px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
input.search{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:6px 10px;min-width:0;flex:1 1 180px;max-width:280px}
/* chart */
.chart-box{position:relative}
.chart-box svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:10px}
.legend i{display:inline-block;width:18px;height:0;border-top:2px solid var(--fg);vertical-align:middle;margin-right:6px}
.legend i.dash{border-top:2px dashed var(--blue)}
.legend i.zero{border-top:1px solid var(--out)}
.tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);font-size:11.5px;padding:6px 8px;border-radius:var(--r);white-space:nowrap;transform:translate(-50%,-110%);font-variant-numeric:tabular-nums}
.fstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.fstats div{display:flex;flex-direction:column;gap:3px}
.fstats span{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.fstats b{font-weight:500;font-size:18px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
/* list */
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.date-chip{display:flex;flex-direction:column;align-items:flex-start;line-height:1}
.date-chip b{font-size:24px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.date-chip span{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:4px}
.li .t{font-weight:500;overflow-wrap:anywhere}
.li .m{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.cal-head h3{margin:0;font-weight:500;font-size:20px;text-transform:uppercase;letter-spacing:-.01em}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal .dow{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface)}
.cal .d{min-height:104px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .d.other{background:var(--surface);color:var(--muted)}
.cal .d .n{font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted)}
.cal .d.today .n{background:var(--blue);color:var(--blue-fg);padding:0 5px;align-self:flex-start}
.ev{font-size:11px;padding:3px 5px;border-radius:var(--r);border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;text-align:left;border-top:0;border-right:0;border-bottom:0;width:100%}
.ev:hover{background:color-mix(in srgb,var(--c) 30%,transparent)}
.catleg{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.catleg span::before{content:"";display:inline-block;width:9px;height:9px;background:var(--c);margin-right:6px;vertical-align:-1px}
/* budget bar */
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:5px;min-width:80px}
.bar i{display:block;height:100%;background:var(--fg)}
.bar.over i{background:var(--out)}
/* legal */
.legal-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
dl.kv{margin:0;display:grid;grid-template-columns:minmax(120px,40%) minmax(0,1fr)}
dl.kv dt,dl.kv dd{margin:0;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
dl.kv dt{color:var(--muted);text-transform:uppercase;font-size:10.5px;letter-spacing:.05em;padding-top:12px}
dl.kv dd{overflow-wrap:anywhere}
dl.kv dd.todo{color:var(--warn)}
.prose{max-width:68ch;font-size:15px;line-height:1.6;white-space:pre-wrap}
.raison{font-size:clamp(20px,2.4vw,28px);font-weight:500;letter-spacing:-.015em;line-height:1.25;max-width:40ch;white-space:pre-wrap;text-wrap:balance}
details.art{border-bottom:1px solid var(--line)}
details.art summary{cursor:pointer;padding:12px 0;display:flex;gap:14px;align-items:baseline;list-style:none}
details.art summary::-webkit-details-marker{display:none}
details.art summary .no{font-family:var(--mono);font-size:11px;color:var(--muted);min-width:56px}
details.art summary b{font-weight:500}
details.art .prose{padding:0 0 14px 70px;font-size:14px;color:var(--fg)}
.check{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px}
.check:last-child{border-bottom:0}
.check .when{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
/* access matrix */
.matrix select{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:5px 8px;font-size:12px}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;padding:max(40px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));z-index:50;overflow:auto}
.modal{background:var(--bg);border:1px solid var(--line-2);width:100%;max-width:560px;border-radius:var(--r)}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal header h3{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.05em;font-weight:500}
.modal form{padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.f input,.f select,.f textarea{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:8px 10px;width:100%}
.f textarea{min-height:110px;resize:vertical}
.f .hint{font-size:11px;color:var(--muted)}
.modal .foot{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding-top:6px}
.picker{position:relative}
.picker ul{list-style:none;margin:4px 0 0;padding:0;border:1px solid var(--line-2);background:var(--surface);max-height:180px;overflow:auto}
.picker li button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:transparent;border:0;padding:7px 9px;cursor:pointer}
.picker li button:hover{background:var(--surface-2)}
.picker img,.av{width:20px;height:20px;border-radius:50%;flex:none}
.person{display:inline-flex;align-items:center;gap:7px}
/* banners & toast */
.banner{border:1px solid var(--line-2);padding:10px 14px;font-size:12.5px;margin-bottom:18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-radius:var(--r)}
.banner.warn{border-color:var(--warn);color:var(--warn)}
.banner.blue{border-color:var(--blue);background:var(--blue-soft)}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 14px;font-size:12.5px;border-radius:var(--r);z-index:60;max-width:min(380px,calc(100vw - 32px))}
.foot-legal{margin-top:48px;padding-top:16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.lock{padding:60px 0;max-width:46ch}
.lock h2{font-weight:500;text-transform:uppercase;font-size:22px;margin:0 0 8px}
.lock p{color:var(--muted);margin:0}
/* responsive */
@media (max-width:980px){.grid2,.legal-grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:20;border-right:0;border-bottom:1px solid var(--line);padding-left:0}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--blue)}
  .logo{flex-direction:row;align-items:center;justify-content:space-between;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));gap:10px}
  .logo small{display:none}
  .logo b{font-size:18px}
  nav.menu{flex-direction:row;padding:6px max(16px,env(safe-area-inset-left,0px));overflow-x:auto;gap:2px}
  nav.menu a{white-space:nowrap;padding:8px 9px;font-size:11.5px}
  nav.menu a .lv{display:none}
  .who{display:none}
  main{padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .modal form{grid-template-columns:minmax(0,1fr)}
  .cal .d{min-height:64px;padding:3px}
  .cal .ev{font-size:0;padding:0;height:6px;border-left-width:0;background:var(--c)}
  .li{grid-template-columns:48px minmax(0,1fr)}
  .li > :last-child{grid-column:2}
  details.art .prose{padding-left:0}
}
.mobile-role{display:none}
@media (max-width:760px){.mobile-role{display:flex;margin-bottom:14px}}
@media (prefers-reduced-motion:no-preference){.kpi .v,.panel{transition:opacity .2s}}

/* --- Connexion & barre mobile (version GitHub + Supabase) --- */
.auth{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.auth-brand{background:var(--blue);color:var(--blue-fg);padding-block:28px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:28px;display:flex;flex-direction:column;justify-content:space-between;gap:40px}
.auth-brand small{font-size:10px;letter-spacing:.06em;text-transform:uppercase;line-height:1.3}
.auth-brand h1{margin:0;font-weight:500;font-size:clamp(36px,5vw,64px);letter-spacing:-.03em;line-height:.95;text-transform:uppercase}
.auth-brand p{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.auth-form{display:flex;align-items:center;justify-content:center;padding-block:40px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px))}
.auth-form form{width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px}
.auth-form h2{margin:0 0 6px;font-weight:500;font-size:22px;text-transform:uppercase;letter-spacing:-.01em}
.auth-form p.sub{margin:0 0 8px;color:var(--muted);font-size:13px}
.auth-form .or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.auth-form .or::before,.auth-form .or::after{content:"";flex:1;border-top:1px solid var(--line)}
.auth-form .btn{justify-content:center;padding:11px 14px}
.auth-msg{font-size:13px;padding:10px 12px;border:1px solid var(--line-2);border-radius:var(--r)}
.auth-msg.ok{border-color:var(--in);color:var(--in)}
.auth-msg.err{border-color:var(--out);color:var(--out)}
.who .row{display:flex;gap:6px;flex-wrap:wrap}
.mobile-bar{display:none;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;font-size:12px;color:var(--muted)}
.mobile-bar select{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:5px 8px;font-size:12px}
@media (max-width:760px){
  .auth{grid-template-columns:minmax(0,1fr)}
  .auth-brand{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .auth-form{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .mobile-bar{display:flex}
}
</style>
</head>
<body>
<div id="auth-root" hidden></div>
<div class="app" id="app" hidden>
  <aside class="side">
    <div class="logo">
      <small>Proteus Group — Antenne<br>Arts et Métiers<br>Usage interne</small>
      <div><b>ProteusBoard</b></div>
    </div>
    <nav class="menu" id="menu" aria-label="Pages"></nav>
    <div class="who" id="who"></div>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>
<div id="modal-root"></div>
<div id="toast" class="toast" hidden></div>
<noscript>ProteusBoard nécessite JavaScript.</noscript>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
</body>
</html>
