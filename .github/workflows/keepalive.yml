# Évite la mise en pause du projet Supabase gratuit (après 7 jours sans activité).
# Nécessite deux secrets dans GitHub > Settings > Secrets and variables > Actions :
#   SUPABASE_URL et SUPABASE_ANON_KEY (les mêmes valeurs que dans config.js).
name: Keepalive Supabase
on:
  schedule:
    - cron: "0 6 */3 * *"   # tous les 3 jours à 6 h UTC
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Appel léger à l'API Supabase
        run: |
          curl -fsS "${{ secrets.SUPABASE_URL }}/auth/v1/health" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" -o /dev/null -w "HTTP %{http_code}\n"
